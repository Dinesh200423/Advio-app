name: freelance_os
description: ADVIO business app for leads, projects, delivery checklists, finance and team.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  url_launcher: ^6.3.1
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  google_fonts: 8.0.0
  intl: ^0.20.3
  sentry_flutter: ^10.6.0
  supabase_flutter: ^2.18.3
  uuid: ^4.6.0
  package_info_plus: ^10.2.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - google_fonts/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#1C1C1C"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
