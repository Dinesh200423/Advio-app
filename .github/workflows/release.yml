name: Release the Android app

# Publishes a new version of the app. To release, push a version tag with a short note for the team:
#   git tag -a v1.1.0 -m "Push alerts for new leads."
#   git push origin v1.1.0
# The app checks for the newest release when it opens, and offers it to whoever is using it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Updates only install over the existing app when it is signed with the same key every time.
      - name: Restore the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing or empty."; exit 1; fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "::error::Secret ANDROID_KEYSTORE_PASSWORD is missing or empty."; exit 1; fi
          # Stray spaces or line breaks from copy and paste are harmless.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/advio-release.jks"             || { echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Copy the whole contents of advio-release.jks.base64.txt again."; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/advio-release.jks" -storepass "$KEYSTORE_PASSWORD" > /dev/null             || { echo "::error::The keystore could not be opened. Either the base64 secret is incomplete or the password secret is wrong."; exit 1; }
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/advio-release.jks" >> "$GITHUB_ENV"

      # These two values are public by design (they are also on the website). The database rules protect the data.
      - name: Write the app's connection settings
        run: |
          cat > env.json <<JSON
          {
            "SUPABASE_URL": "${{ vars.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ vars.SUPABASE_ANON_KEY }}",
            "APP_ENV": "production"
          }
          JSON

      - name: Build the APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: advio
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build apk --release --dart-define-from-file=env.json --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk "ADVIO-$VERSION.apk"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The checkout step turns the tag into a plain pointer, so fetch the tag again to get its message.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          NOTES="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          [ -z "$NOTES" ] && NOTES="Improvements and fixes."
          gh release create "$GITHUB_REF_NAME" "ADVIO-$VERSION.apk" --title "ADVIO $VERSION" --notes "$NOTES"
